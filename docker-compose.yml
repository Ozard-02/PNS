services:
  event-tracker:
    build: .
    container_name: ai-event-tracker
    restart: unless-stopped
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      - EVENT_LOCATION=${EVENT_LOCATION:-}
      - SEARCH_RADIUS_DAYS=${SEARCH_RADIUS_DAYS:-14}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      - DB_PATH=/data/eventi.db
      - GOOGLE_CREDENTIALS_PATH=/data/credentials.json
      - GOOGLE_TOKEN_PATH=/data/token.json
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-5}

    volumes:
      - ./data:/data   # persistenza DB SQLite + credenziali Google
